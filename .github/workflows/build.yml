name: Build StudyFlow APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q StudyFlowAndroidProject-Fixed.zip -d source

      - name: Build APK
        run: |
          cd source/StudyFlowAndroid
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-debug-apk
          path: source/StudyFlowAndroid/app/build/outputs/apk/debug/app-debug.apk
